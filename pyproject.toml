[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "atlas"
dynamic = ["version"]
description = "Executable text harness for durable AI thinking programs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    {name = "AlexKay28", email = "alexkay28@users.noreply.github.com"},
]
keywords = ["agents", "dsl", "event-sourcing", "llm", "workflow"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/AlexKay28/atlas"
Repository = "https://github.com/AlexKay28/atlas"
Documentation = "https://github.com/AlexKay28/atlas/tree/main/docs"
Changelog = "https://github.com/AlexKay28/atlas/blob/main/CHANGELOG.md"
Issues = "https://github.com/AlexKay28/atlas/issues"

[project.scripts]
atlas = "atlas.cli:main"

[tool.setuptools.dynamic]
version = {attr = "atlas.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
