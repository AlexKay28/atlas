# Custom battery manifest — 3 deterministic tasks with fake workers
#
# Proves the runner end-to-end with fake workers and graders.
# No live model dependency; runs in CI.

manifest_name: custom-battery-3
benchmark:
  name: custom
  version: "1.0"

# These tasks use deterministic fake workers (sleep+echo) and
# DBStateGrader for grading.  They exercise:
# 1. A simple define→report task (react arm baseline)
# 2. A search→fetch→report task (both arms)
# 3. A delegate-authoring task (tikhon arm; authoring charged)

tasks:
  - task_id: "custom-001"
    description: "Return the order status for order 42"
    expected_state:
      status: "confirmed"
    program_source: |
      PROGRAM task_001 VERSION 1.0
      INPUT
          G.task = "Return the order status for order 42"
      step.understand: DO define(request = G.task) -> P.goal
      step.report: DO report(committed_refs = P.goal, format = "json") -> OUT.answer
      RETURN OUT.answer
    authoring_attempts_expected: 0

  - task_id: "custom-002"
    description: "Search for products and report findings"
    expected_state:
      products: []
    program_source: |
      PROGRAM task_002 VERSION 1.0
      INPUT
          G.task = "Search for products and report findings"
      step.search: DO search(query = G.task, scope = "env") -> E.found
      step.report: DO report(committed_refs = E.found, format = "json") -> OUT.answer
      RETURN OUT.answer
    authoring_attempts_expected: 0

  - task_id: "custom-003"
    description: "Delegate a subtask to measure authoring parity"
    expected_state:
      delegated: true
    program_source: |
      PROGRAM task_003 VERSION 1.0
      INPUT
          G.goal = "Delegate a subtask to measure authoring parity"
          C.scope = "env"
      step.author: DO delegate(goal = G.goal, constraints = C.scope, max_steps = 3) -> OUT.plan, OUT.metrics
      step.report: DO report(committed_refs = OUT.plan, format = "json") -> OUT.answer
      RETURN OUT.answer
    authoring_attempts_expected: 1

grader:
  type: db_state_match
repetitions: 1
