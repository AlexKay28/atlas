task_id: hard-math
description: >
  A factory produces widgets. In week 1, it produces 500 widgets at $4 each.
  In week 2, production increases by 20% but the cost per widget drops by $0.50.
  In week 3, production doubles from week 2, but a machine breakdown wastes 30% of output.
  The remaining week 3 widgets are sold at a 15% markup over week 2's cost.
  In week 4, all unsold inventory (weeks 1-3 combined) is sold at a 10% discount from week 1's price.
  
  Total revenue across all 4 weeks (in dollars)? Answer with just the number.
