task_id: routing-02
description: "Given 6 delivery routes with distances [12, 25, 8, 17, 30, 5] km and costs [3, 7, 2, 5, 9, 1] units/km, and a constraint that total cost must be under 50 units, find all routes that satisfy the constraint and report the count."
difficulty: medium
expected_state:
  answer: "3 routes satisfy the constraint"
grader:
  type: exact_match
  params:
    answer: "3 routes satisfy the constraint"
program_source: |
  PROGRAM routing_02_constraint_count VERSION 1.0
  INPUT
      G.goal = "Given 6 delivery routes with distances [12, 25, 8, 17, 30, 5] km and costs [3, 7, 2, 5, 9, 1] units/km, and a constraint that total cost must be under 50 units, find all routes that satisfy the constraint and report the count."
  step.calculate_totals: DO calculate(expression = "total cost per route as distance * cost for routes 1-6") -> P.totals
  step.check_constraint: DO check(condition = "each total in P.totals satisfies the constraint total cost under 50 units") -> P.eligible
  step.report: DO report(committed_refs = P.eligible, format = "json") -> OUT.answer
  RETURN OUT.answer
authoring_attempts_expected: 1
