task_id: routing-02
description: Given 6 delivery routes with distances [12, 25, 8, 17, 30, 5] km and
  costs [3, 7, 2, 5, 9, 1] units/km, and a constraint that total cost must be under
  50 units, find all routes that satisfy the constraint and report the count.
difficulty: medium
expected_state:
  value: 3
grader:
  type: numeric
  params:
    value: 3
program_source: "PROGRAM routing_02 VERSION 1.0\nINPUT\n    G.goal = \"Given 6 delivery\
  \ routes with distances [12, 25, 8, 17, 30, 5] km and costs [3, 7, 2, 5, 9, 1] units/km,\
  \ and a constraint that total cost must be under 50 units, find all routes that\
  \ satisfy the constraint and report the count.\"\nstep.compute: DO calculate(expression\
  \ = \"12*3, 25*7, 8*2, 17*5, 30*9, 5*1\") -> P.totals\nstep.check: DO check(condition\
  \ = \"count of totals under 50 units\", data = P.totals) -> P.count\nstep.report:\
  \ DO report(committed_refs = P.count, format = \"text\") -> OUT.answer\nRETURN OUT.answer\n"
authoring_attempts_expected: 1
