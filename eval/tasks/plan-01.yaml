program_source: "PROGRAM plan_01 VERSION 1.0\nINPUT\n    G.goal = \"Decompose the\
  \ goal Deploy a web app to production into 5 ordered subtasks. Count them and return\
  \ the number.\"\nstep.decompose: DO decompose(goal = \"Deploy a web app to production\
  \ into 5 ordered subtasks: 1) Run tests 2) Build artifact 3) Configure environment\
  \ 4) Deploy to server 5) Verify deployment\") -> P.subtasks\nstep.count: DO calculate(expression\
  \ = \"count the subtasks\", data = P.subtasks) -> P.count\nstep.report: DO report(committed_refs\
  \ = P.count, format = \"text\") -> OUT.answer\nRETURN OUT.answer\n"
