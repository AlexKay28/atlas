task_id: plan-01
description: Decompose the goal 'Deploy a web app to production' into ordered subtasks.
  Return the number of subtasks.
difficulty: medium
expected_state:
  value: 5
grader:
  type: numeric
  params:
    value: 5
program_source: "PROGRAM plan_01 VERSION 1.0\nINPUT\n    G.goal = \"Decompose the\
  \ goal 'Deploy a web app to production' into exactly 5 ordered subtasks. Return\
  \ the number 5.\"\nstep.decompose: DO decompose(goal = \"Deploy a web app to production\
  \ into exactly 5 ordered subtasks: 1) run tests, 2) build, 3) configure, 4) deploy,\
  \ 5) verify\") -> P.subtasks\nstep.count: DO calculate(expression = \"count of subtasks\"\
  ) -> P.count\nstep.report: DO report(committed_refs = P.count, format = \"text\"\
  ) -> OUT.answer\nRETURN OUT.answer\n"
