task_id: routing-01
description: "Given 4 delivery routes with distances [12, 25, 8, 17] km and costs [3, 7, 2, 5] units/km, find the route with minimum total cost. Report the route number and total cost."
difficulty: easy
expected_state:
  answer: "Route 3, total cost: 16"
grader:
  type: exact_match
  params:
    answer: "Route 3, total cost: 16"
program_source: |
  PROGRAM routing_01_min_cost_route VERSION 1.0
  INPUT
      G.goal = "Given 4 delivery routes with distances [12, 25, 8, 17] km and costs [3, 7, 2, 5] units/km, find the route with minimum total cost. Report the route number and total cost."
  step.calculate_totals: DO calculate(expression = "total cost per route as distance * cost for routes 1-4") -> P.totals
  step.choose_best: DO choose(criterion = "the route with the minimum total cost from P.totals") -> P.best
  step.report: DO report(committed_refs = P.best, format = "json") -> OUT.answer
  RETURN OUT.answer
authoring_attempts_expected: 1
