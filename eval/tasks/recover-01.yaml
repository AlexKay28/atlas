task_id: recover-01
description: "A task runner crashed mid-execution after completing 3 of 5 steps. Describe the recovery procedure in one sentence starting with 'Resume'."
difficulty: medium
expected_state:
  substring: "Resume"
grader:
  type: contains
  params:
    substring: "Resume"
program_source: |
  PROGRAM recover-01-resume-after-crash
  INPUT incident = "task runner crashed mid-execution after completing 3 of 5 steps"
  GOAL "Describe the recovery procedure in one sentence starting with 'Resume'"

  step.1: recall "the 3 completed steps and the 2 remaining steps from the run log" -> state
    DONE matched(ref, "steps")
  step.2: check "steps 1-3 are complete and steps 4-5 are pending" -> gaps
    DONE matched(ref, "pending")
  step.3: define "recovery procedure: Resume execution from step 4 using the saved state of the completed steps 1-3" -> procedure
    DONE matched(ref, "Resume")
  step.4: report "Resume execution from step 4 using the saved state of the completed steps 1-3"
    DONE matched(ref, "Resume")
authoring_attempts_expected: 1
