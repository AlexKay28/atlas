task_id: recover-01
description: "A task runner crashed mid-execution after completing 3 of 5 steps. Describe the recovery procedure in one sentence starting with 'Resume'."
difficulty: medium
expected_state:
  substring: "Resume"
grader:
  type: contains
  params:
    substring: "Resume"
program_source: |
  PROGRAM recover_01 VERSION 1.0
  INPUT
      G.goal = "A task runner crashed mid-execution after completing 3 of 5 steps. Describe the recovery procedure in one sentence starting with 'Resume'."
      G.scenario = "task runner crashed after completing steps 1-3 of 5; steps 4-5 are pending"
  step.recall: DO recall(query = "recovery procedure after crash", data = G.scenario) -> E.state
  step.report: DO report(committed_refs = E.state, format = "text") -> OUT.answer
  RETURN OUT.answer
authoring_attempts_expected: 1
