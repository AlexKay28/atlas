program_source: "PROGRAM search_01 VERSION 1.0\nINPUT\n    G.goal = \"Count how many\
  \ times the word 'quantum' appears in the given text and report the number.\"\n\
  \    G.text = \"quantum mechanics quantum field theory classical mechanics quantum\
  \ computing\"\nstep.search: DO search(query = \"quantum\", data = G.text) -> E.hits\n\
  step.count: DO calculate(expression = \"number of occurrences\", data = E.hits)\
  \ -> P.count\nstep.report: DO report(committed_refs = P.count, format = \"text\"\
  ) -> OUT.answer\nRETURN OUT.answer\n"
