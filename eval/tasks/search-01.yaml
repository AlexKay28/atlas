task_id: search-01
description: "Search the following text for the word 'quantum' and report how many times it appears: 'quantum mechanics quantum field theory classical mechanics quantum computing'"
difficulty: easy
expected_state:
  answer: "3"
grader:
  type: exact_match
  params:
    answer: "3"
program_source: |
  PROGRAM search_01_count_quantum VERSION 1.0
  INPUT
      G.goal = "Search the following text for the word 'quantum' and report how many times it appears: 'quantum mechanics quantum field theory classical mechanics quantum computing'"
  step.search: DO search(query = "the word 'quantum' in the given text") -> E.hits
  step.count: DO calculate(expression = "the number of occurrences in E.hits") -> P.count
  step.report: DO report(committed_refs = P.count, format = "json") -> OUT.answer
  RETURN OUT.answer
authoring_attempts_expected: 1
