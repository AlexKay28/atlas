task_id: code-fix-02
description: "Two files have a logic bug. File A computes x = a * b. File B computes y = x + c but should use y = x * c. Return the corrected line for File B."
difficulty: medium
expected_state:
  substring: "y = x * c"
grader:
  type: contains
  params:
    substring: "y = x * c"
program_source: |
  PROGRAM code_fix_02_file_b_multiply VERSION 1.0
  INPUT
      G.goal = "Two files have a logic bug. File A computes x = a * b. File B computes y = x + c but should use y = x * c. Return the corrected line for File B."
  step.check_file_a: DO check(condition = "File A line x = a * b matches the specification") -> P.file_a_ok
  step.edit: DO edit(instruction = "replace 'y = x + c' with 'y = x * c' in File B") -> P.fixed_b
  step.report: DO report(committed_refs = P.fixed_b, format = "json") -> OUT.answer
  RETURN OUT.answer
authoring_attempts_expected: 1
